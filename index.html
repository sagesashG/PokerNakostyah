<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кости: учёт</title>
<style>
  :root {
    --fg: #f4f6ff;
    --muted: #9aa3c7;
    --card: rgba(255, 255, 255, 0.08);
    --line: rgba(255, 255, 255, 0.14);
    --head: rgba(255, 255, 255, 0.12);
    --turn: rgba(250, 204, 21, 0.28);
    --calc: rgba(250, 204, 21, 0.14);
    --plus-bg: rgba(59, 130, 246, 0.30);
    --plus-fg: #bfdbfe;
    --minus-bg: rgba(248, 113, 113, 0.22);
    --minus-fg: #fecaca;
    --btn: linear-gradient(135deg, #7c3aed, #db2777);
    --page: radial-gradient(1200px 600px at 10% -10%, rgba(124, 58, 237, 0.45), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(236, 72, 153, 0.35), transparent 60%),
      linear-gradient(160deg, #0f172a, #1e1b4b 60%, #172554);
    --table: rgba(15, 23, 42, 0.35);
  }
  /* Тетрадный лист: линейки и поле, как в тетради в клетку. */
  :root[data-theme="notebook"] {
    --fg: #1d2b4a;
    --muted: #5b6b8c;
    --card: rgba(255, 255, 255, 0.88);
    --line: #a9c7e6;
    --head: #eef4fb;
    --turn: #ffe98a;
    --calc: #fff4c2;
    --plus-bg: #cfe4ff;
    --plus-fg: #1b4f8a;
    --minus-bg: #ffd6d6;
    --minus-fg: #8a2b2b;
    --table: rgba(255, 255, 255, 0.92);
    --btn: linear-gradient(135deg, #3b6fd8, #2b59b8);
    --page: linear-gradient(to right, transparent 56px, #f08080 56px 58px, transparent 58px),
      repeating-linear-gradient(to bottom, transparent 0 27px, #9ec5e8 27px 28px),
      #fffdf5;
  }
  /* Трава: зелёный газон и светлые карточки. */
  :root[data-theme="grass"] {
    --fg: #143d12;
    --muted: #2f5a2a;
    --card: rgba(255, 255, 255, 0.55);
    --line: rgba(20, 61, 18, 0.25);
    --head: rgba(255, 255, 255, 0.6);
    --turn: #ffd54a;
    --calc: rgba(255, 236, 150, 0.8);
    --plus-bg: rgba(90, 160, 255, 0.45);
    --plus-fg: #0d2f63;
    --minus-bg: rgba(255, 120, 120, 0.45);
    --minus-fg: #5a0f0f;
    --table: rgba(255, 255, 255, 0.55);
    --btn: linear-gradient(135deg, #2f8f3a, #6bb83b);
    --page: linear-gradient(rgba(20, 61, 18, 0.25), rgba(20, 61, 18, 0.25)),
      url("https://upload.wikimedia.org/wikipedia/commons/2/29/Green_grass_nature.jpg") center / cover,
      #4f9e3a;
  }
  [hidden] { display: none !important; }
  .theme-pick {
    margin: 0 0 12px auto;
    padding: 6px 10px;
    font-size: 14px;
    color: var(--fg);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 16px;
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    background: var(--page);
    background-attachment: fixed;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 12px;
    backdrop-filter: blur(10px);
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .add-box { margin-top: 10px; }
  .add-box summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  input, button { font: inherit; border-radius: 12px; border: 1px solid var(--line); padding: 10px 14px; }
  input:not([type=number]) { background: rgba(255, 255, 255, 0.08); color: var(--fg); }
  button { background: var(--btn); color: #fff; border: none; font-weight: 600; cursor: pointer; }
  button.ghost { background: rgba(255, 255, 255, 0.12); }
  #status, #whoami { color: var(--muted); font-size: 14px; }
  .title { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .place { display: flex; justify-content: space-between; gap: 12px; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 18px; }
  .place:last-child { border-bottom: none; }
  .place.first { font-size: 24px; font-weight: 800; }
  .choices { display: grid; gap: 8px; margin-bottom: 10px; }
  .choice {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--line);
    color: var(--fg);
  }
  .choice small { color: var(--muted); font-weight: 400; }
  .scroll { overflow-x: auto; border-radius: 18px; }
  table {
    border-collapse: separate;
    border-spacing: 0;
    min-width: 100%;
    background: var(--table);
    border-radius: 18px;
    overflow: hidden;
  }
  th, td { padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
  th { background: var(--head); font-weight: 700; }
  th.player { font-size: 17px; padding: 10px; }
  th.school { font-size: 12px; color: var(--muted); font-weight: 600; }
  th.turn { background: var(--turn); }
  td.label { text-align: left; white-space: nowrap; font-weight: 600; min-width: 130px; }
  td.plus-row { background: var(--plus-bg); color: var(--plus-fg); }
  td.good { box-shadow: inset 0 0 0 2px #4ade80; font-weight: 800; }
  td.minus-row { background: var(--minus-bg); color: var(--minus-fg); }
  td.calc { background: var(--calc); font-weight: 800; white-space: nowrap; }
  /* Красный овал, нарисованный ручкой: незамкнутый, с перехлёстом у начала. */
  td.calc .bonus { position: relative; display: inline-block; padding: 0 12px; color: #fde68a; }
  td.calc .bonus svg {
    position: absolute;
    left: -14px;
    top: -8px;
    width: calc(100% + 28px);
    height: calc(100% + 16px);
    overflow: visible;
    pointer-events: none;
  }
  td.calc .bonus path { fill: none; stroke: #e11d48; stroke-width: 2.5; stroke-linecap: round; }
  td input {
    width: 56px;
    text-align: center;
    font: inherit;
    background: transparent;
    border: none;
    color: inherit;
    padding: 4px;
    border-radius: 8px;
  }
  td input:disabled { opacity: 0.25; }
  td input:focus { outline: 2px solid #a78bfa; background: rgba(255, 255, 255, 0.1); }
  .float-pass {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    padding: 16px 28px;
    font-size: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    z-index: 6;
  }
  .credit { position: fixed; left: 8px; bottom: 6px; font-size: 11px; color: #fff; opacity: 0.85; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
  .credit a { color: #fff; }
  #toast {
    position: fixed;
    left: 50%;
    top: 20px;
    transform: translateX(-50%);
    width: min(92vw, 560px);
    padding: 14px 18px;
    border-radius: 14px;
    background: #7f1d1d;
    color: #fff;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    z-index: 10;
  }
</style>
</head>
<body>

<select id="themeSel" class="theme-pick">
  <option value="main">Основная</option>
  <option value="notebook">Тетрадь</option>
  <option value="grass">Трава</option>
</select>

<div id="join" class="card">
  <div class="row">
    <input id="code" inputmode="numeric" placeholder="Код комнаты" maxlength="6">
    <button id="joinBtn">Войти</button>
    <button id="newBtn" class="ghost">Новая комната</button>
  </div>
  <div style="margin-top: 14px">
    <div class="title" id="roomsTitle">Активные комнаты загружаются…</div>
    <div id="roomList" class="choices"></div>
  </div>
</div>

<div id="room" hidden>
  <div class="card">
    <div class="row">
      <span id="status"></span>
      <span id="whoami"></span>
      <span style="flex: 1"></span>
      <button id="switchBtn" class="ghost">Сменить</button>
      <button id="leaveBtn" class="ghost">Выйти</button>
    </div>
    <details class="add-box">
      <summary>Добавить игрока</summary>
      <div class="row" style="margin-top: 10px">
        <input id="newName" placeholder="Имя игрока">
        <button id="addBtn">Добавить</button>
      </div>
    </details>
    <button id="passBtn" hidden>Передать ход</button>
  </div>

  <div class="card" id="pick" hidden>
    <div class="title">Кто вы в этой комнате?</div>
    <div id="pickList" class="choices"></div>
    <button id="viewBtn" class="ghost">Это телевизор — показать всех</button>
  </div>

  <div class="card" id="results" hidden></div>
  <div class="card" id="turnInfo" style="font-size: 20px; font-weight: 700"></div>
  <div class="scroll"><table id="sheet"></table></div>
</div>

<div id="toast" hidden></div>

<button id="floatPass" class="float-pass" hidden>Пропустить ход</button>

<div id="credit" class="credit" hidden>
  Фото: Dhivya Annadurai, <a href="https://commons.wikimedia.org/wiki/File:Green_grass_nature.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC BY-SA 4.0
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: 'AIzaSyCLBAG_CUE-efrhEJpKRDO2e2mzkeJCnB0',
  authDomain: 'pokernakostyah.firebaseapp.com',
  databaseURL: 'https://pokernakostyah-default-rtdb.firebaseio.com',
  projectId: 'pokernakostyah',
  storageBucket: 'pokernakostyah.firebasestorage.app',
  messagingSenderId: '5093102343',
  appId: '1:5093102343:web:bfa971c72db88110066ba2'
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Комната живёт, пока в неё вносят изменения. Через два дня без изменений она удаляется.
const ROOM_TTL_MS = 2 * 24 * 60 * 60 * 1000;

// Три школы. У каждого игрока своя колонка на каждую школу.
const SCHOOLS = [
  { id: 1, title: 'Школа 1', sub: 'по порядку' },
  { id: 2, title: 'Школа 2', sub: 'любой порядок' },
  { id: 3, title: 'Школа 3', sub: 'снизу вверх' }
];

const COMBOS = ['pair', 'twoPair', 'full', 'kare', 'poker'];
// Порядок заполнения школы 1 (сверху вниз). Школа 3 — то же, но в обратном порядке.
const SEQ = ['u1', 'u2', 'u3', 'u4', 'u5', 'u6', 'plus', 'minus', 'pair', 'twoPair', 'full', 'kare', 'poker'];

// Строки таблицы в порядке отображения.
const ROWS = [
  ...[1, 2, 3, 4, 5, 6].map(n => ({ k: 'u' + n, t: String(n) })),
  { k: 'upper', t: 'Сумма', calc: true },
  { k: 'plus', t: '+', cls: 'plus-row' },
  { k: 'minus', t: '−', cls: 'minus-row' },
  { k: 'pair', t: 'П' },
  { k: 'twoPair', t: '2П' },
  { k: 'full', t: 'Ф' },
  { k: 'kare', t: 'К' },
  { k: 'poker', t: 'Покер' },
  { k: 'total', t: 'Итог школы', calc: true }
];

const range = (from, to, step = 1) => {
  const out = [];
  for (let x = from; x <= to; x += step) out.push(x);
  return out;
};

// Кратность проверяем только там, где она точно известна:
// строки 1–6 — n × количество кубиков с номиналом n (от 0 до 5);
// К — четыре одинаковых кубика (4 × номинал); Покер — пять одинаковых (5 × номинал).
// Для П, 2П, Ф и «+»/«−» проверяется только максимум (и минимум у Ф).
function allowedValues(k) {
  if (/^u[1-6]$/.test(k)) {
    const n = Number(k[1]);
    return range(0, 5).map(i => n * i);
  }
  if (k === 'kare') return [0, ...range(4, 24, 4)];
  if (k === 'poker') return [0, ...range(5, 30, 5)];
  return null;
}

// Наибольшее значение строки.
const LIMITS = { pair: 12, twoPair: 24, full: 30, kare: 24, poker: 30, plus: 30, minus: 30 };
function limitOf(k) {
  if (/^u[1-6]$/.test(k)) return 5 * Number(k[1]);
  return LIMITS[k] ?? Infinity;
}

// Наименьшее ненулевое значение строки (0 всегда допустим — «не записано»).
// «+» и «−» — сумма всех пяти кубиков, поэтому минимум 5 и максимум 30.
const MINIMUMS = { full: 5, plus: 5, minus: 5 };

// Проверка значения. Возвращает текст ошибки или null.
function checkValue(k, v) {
  if (!Number.isInteger(v) || v < 0) return 'Нужно целое число, не меньше 0.';
  const max = limitOf(k);
  if (v > max) return `Здесь не больше ${max}.`;
  const min = MINIMUMS[k] || 0;
  if (v !== 0 && v < min) return `Здесь минимум ${min}.`;
  const allowed = allowedValues(k);
  if (allowed && !allowed.includes(v)) {
    const list = allowed.filter(x => x > 0).join(', ');
    return `Здесь нельзя записать ${v}. Допустимо: 0, ${list}.`;
  }
  return null;
}

let code = '';
let state = null;
// Режим устройства в комнате: { type: 'player', name } — телефон игрока, { type: 'view' } — телевизор, null — ещё не выбран.
let mode = null;

const cellKey = (school, k) => `s${school}_${k}`;

function val(cells, school, k) {
  const v = cells && cells[cellKey(school, k)];
  return v == null ? null : Number(v);
}

function schoolScore(cells, school) {
  const sumU = [1, 2, 3, 4, 5, 6].reduce((t, n) => t + (val(cells, school, 'u' + n) || 0), 0);
  const bonus = sumU >= 60 ? 30 : 0;
  const combos = COMBOS.reduce((t, k) => t + (val(cells, school, k) || 0), 0);
  const total = sumU + bonus + (val(cells, school, 'plus') || 0) - (val(cells, school, 'minus') || 0) + combos;
  return { sumU, bonus, total };
}

// Ячейка открыта, если все ячейки перед ней в порядке школы уже заполнены.
function isOpen(cells, school, k) {
  let seq = null;
  if (school === 1) seq = SEQ;
  if (school === 3) seq = [...SEQ].reverse();
  if (!seq) return true;
  const idx = seq.indexOf(k);
  for (let i = 0; i < idx; i++) {
    if (val(cells, school, seq[i]) == null) return false;
  }
  return true;
}

// Ячейку можно менять, если она открыта и либо за этот ход ещё ничего не записано,
// либо это та самая ячейка, которую записали в этом ходу (исправление ошибки).
function isEditable(room, playerIndex, school, k) {
  if (!room || (room.turn || 0) !== playerIndex) return false;
  const cells = room.players[playerIndex].cells;
  if (!isOpen(cells, school, k)) return false;
  if (!room.entered) return true;
  return room.enteredCell === cellKey(school, k);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function ago(ms) {
  const min = Math.round((Date.now() - ms) / 60000);
  if (min < 1) return 'только что';
  if (min < 60) return `${min} мин назад`;
  const h = Math.round(min / 60);
  if (h < 24) return `${h} ч назад`;
  return `${Math.round(h / 24)} дн назад`;
}

// Режим запоминается на этом устройстве для каждой комнаты.
function loadMode(c) {
  try { return JSON.parse(localStorage.getItem('kosti.mode.' + c)); } catch (e) { return null; }
}
function saveMode(c, m) {
  try {
    if (m) localStorage.setItem('kosti.mode.' + c, JSON.stringify(m));
    else localStorage.removeItem('kosti.mode.' + c);
  } catch (e) { /* без хранилища просто не запомним режим */ }
}
function setMode(m) {
  mode = m;
  saveMode(code, m);
  render();
}

let toastTimer;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
}

// Итоги появляются, когда у всех игроков заполнены все 39 ячеек. Одинаковые очки делят место.
function renderResults(players) {
  const box = document.getElementById('results');
  const done = players.length > 0 && players.every(p => Object.keys(p.cells || {}).length === 39);
  box.hidden = !done;
  if (!done) return;
  const rows = players
    .map(p => ({ name: p.name, total: SCHOOLS.reduce((t, sc) => t + schoolScore(p.cells, sc.id).total, 0) }))
    .sort((a, b) => b.total - a.total);
  const medals = ['🥇', '🥈', '🥉'];
  let place = 0;
  let prev = null;
  box.innerHTML = '<div class="title">Итоги игры</div>' + rows.map((r, i) => {
    if (r.total !== prev) { place = i + 1; prev = r.total; }
    const mark = medals[place - 1] || '';
    return `<div class="place ${place === 1 ? 'first' : ''}"><span>${mark} ${place} место · ${esc(r.name)}</span><b>${r.total}</b></div>`;
  }).join('') + `<div class="row" style="margin-top: 14px">
    <button data-act="restart">Начать заново</button>
    <button class="ghost" data-act="close">Закрыть комнату</button>
  </div>`;
}

function render() {
  const players = (state && state.players) || [];
  const turn = (state && state.turn) || 0;
  const pick = document.getElementById('pick');
  const sheet = document.getElementById('sheet');
  renderResults(players);

  // Экран выбора: кто вы или телевизор.
  pick.hidden = !!mode;
  // Кнопка передачи хода внизу: появляется на телефоне игрока, чей сейчас ход.
  const myIndex = mode && mode.type === 'player' ? players.findIndex(p => p.name === mode.name) : -1;
  const myTurn = myIndex >= 0 && myIndex === turn;
  const floatPass = document.getElementById('floatPass');
  floatPass.hidden = !myTurn;
  floatPass.textContent = state && state.entered ? 'Передать ход' : 'Пропустить ход';
  document.getElementById('passBtn').hidden = true;
  document.getElementById('whoami').textContent =
    !mode ? '' : mode.type === 'player' ? `Вы: ${mode.name}` : 'Режим телевизора: все игроки';

  if (!mode) {
    document.getElementById('pickList').innerHTML = players.map(p =>
      `<button class="choice" data-name="${esc(p.name)}">Я — ${esc(p.name)}</button>`
    ).join('') || '<div class="title">Игроков пока нет. Добавьте их ниже и выберите себя.</div>';
    sheet.innerHTML = '';
    document.getElementById('turnInfo').textContent = '';
    return;
  }

  // Телефон показывает только колонку игрока, телевизор — всех.
  let visible = players.map((_, i) => i);
  if (mode.type === 'player') {
    const idx = players.findIndex(p => p.name === mode.name);
    visible = idx >= 0 ? [idx] : [];
  }

  let html = '<tr><th></th>' + visible.map(i => {
    const p = players[i];
    const total = SCHOOLS.reduce((t, sc) => t + schoolScore(p.cells, sc.id).total, 0);
    return `<th class="player ${i === turn ? 'turn' : ''}" colspan="3">${esc(p.name)} · ${total}</th>`;
  }).join('') + '</tr>';

  html += '<tr><th></th>' + visible.map(() =>
    SCHOOLS.map(sc => `<th class="school">${sc.title}</th>`).join('')
  ).join('') + '</tr>';

  for (const r of ROWS) {
    html += `<tr><td class="label ${r.cls || ''}">${esc(r.t)}</td>`;
    visible.forEach(i => {
      const p = players[i];
      SCHOOLS.forEach(sc => {
        if (r.calc) {
          const s = schoolScore(p.cells, sc.id);
          if (r.k === 'upper') {
            // При бонусе показываем сумму с бонусом сразу, например 99, и обводим её.
            html += s.bonus
              ? `<td class="calc"><span class="bonus">${s.sumU + s.bonus}<svg viewBox="0 0 100 50" preserveAspectRatio="none"><path vector-effect="non-scaling-stroke" d="M72 6 C40 2 8 8 6 26 C4 44 40 50 72 46 C96 42 98 22 80 12 C72 8 62 8 54 11"/></svg></span></td>`
              : `<td class="calc">${s.sumU}</td>`;
          } else {
            html += `<td class="calc">${s.total}</td>`;
          }
        } else {
          const v = val(p.cells, sc.id, r.k);
          // Вносить может только игрок, чей сейчас ход, и только на своём телефоне.
          const editable = mode.type === 'player' && isEditable(state, i, sc.id, r.k);
          const max = limitOf(r.k);
          const maxAttr = Number.isFinite(max) ? ` max="${max}"` : '';
          const cell = `data-p="${i}" data-s="${sc.id}" data-k="${r.k}"`;
          // «Хорошее» значение: в «+» больше 22, в «−» меньше 10.
          const good = v != null && ((r.k === 'plus' && v > 22) || (r.k === 'minus' && v < 10));
          html += `<td class="${r.cls || ''} ${good ? 'good' : ''}"><input type="number" min="0"${maxAttr} value="${v == null ? '' : v}" ${editable ? '' : 'disabled'} ${cell}></td>`;
        }
      });
    });
    html += '</tr>';
  }

  sheet.innerHTML = html;

  let info = players.length ? `Ходит: ${players[turn].name}` : 'Добавьте игроков';
  if (mode.type === 'player' && state && state.entered) {
    info += ' · значение записано, можно исправить или передать ход';
  }
  if (mode.type === 'player' && visible.length === 0) {
    info = `Игрока «${mode.name}» нет в комнате. Нажмите «Сменить».`;
  }
  document.getElementById('turnInfo').textContent = info;
}

function connect(c) {
  code = c;
  document.getElementById('join').hidden = true;
  document.getElementById('room').hidden = false;
  history.replaceState(null, '', '#' + code);
  mode = loadMode(code);

  db.ref('rooms/' + code).on('value', snap => {
    state = snap.val();
    render();
  }, err => toast('Нет доступа к базе: ' + err.message));

  db.ref('.info/connected').on('value', s => {
    document.getElementById('status').textContent = s.val() ? '● онлайн' : '● нет связи';
  });

  render();
}

// Список активных комнат. Заодно удаляет комнаты без изменений дольше двух суток.
function showRooms() {
  db.ref('rooms').on('value', snap => {
    const all = snap.val() || {};
    const now = Date.now();
    const active = [];
    for (const [id, room] of Object.entries(all)) {
      const updated = room && room.updatedAt;
      if (!updated || now - updated > ROOM_TTL_MS) {
        db.ref('rooms/' + id).remove();
        continue;
      }
      active.push({ id, room, updated });
    }
    active.sort((a, b) => b.updated - a.updated);

    document.getElementById('roomList').innerHTML = active.map(({ id, room, updated }) => {
      const names = ((room && room.players) || []).map(p => esc(p.name)).join(', ') || 'пока без игроков';
      return `<button class="choice" data-room="${esc(id)}"><span><b>${esc(id)}</b> · ${names}</span><small>${ago(updated)}</small></button>`;
    }).join('');
    document.getElementById('roomsTitle').textContent =
      active.length ? 'Активные комнаты' : 'Активных комнат нет';
  });
}

document.getElementById('roomList').addEventListener('click', e => {
  const btn = e.target.closest('button[data-room]');
  if (btn) connect(btn.dataset.room);
});

document.getElementById('pickList').addEventListener('click', e => {
  const btn = e.target.closest('button[data-name]');
  if (btn) setMode({ type: 'player', name: btn.dataset.name });
});

document.getElementById('viewBtn').onclick = () => setMode({ type: 'view' });
document.getElementById('switchBtn').onclick = () => setMode(null);
// Выход на страницу входа. Комната не удаляется, вернуться можно из списка активных комнат.
document.getElementById('leaveBtn').onclick = leaveRoom;

document.getElementById('joinBtn').onclick = () => {
  const c = document.getElementById('code').value.trim();
  if (c) connect(c);
};

document.getElementById('newBtn').onclick = () => {
  const id = String(Math.floor(1000 + Math.random() * 9000));
  connect(id);
  db.ref(`rooms/${id}/updatedAt`).set(Date.now());
};

// Имена уникальны: по имени телефон находит свою колонку.
document.getElementById('addBtn').onclick = () => {
  const input = document.getElementById('newName');
  const name = input.value.trim();
  if (!name) return;
  if (state && (state.players || []).some(p => p.name === name)) {
    toast('Игрок с таким именем уже есть.');
    return;
  }
  db.ref(`rooms/${code}/players`).transaction(list => {
    list = list || [];
    if (list.some(p => p.name === name)) return;
    list.push({ name, cells: {} });
    return list;
  });
  db.ref(`rooms/${code}/updatedAt`).set(Date.now());
  input.value = '';
};

// Передача хода: следующий игрок, запись этого хода сбрасывается.
const passTurn = () => {
  db.ref(`rooms/${code}`).transaction(room => {
    if (!room || !room.players || !room.players.length) return room;
    room.turn = ((room.turn || 0) + 1) % room.players.length;
    room.entered = false;
    room.enteredCell = null;
    room.updatedAt = Date.now();
    return room;
  });
};
document.getElementById('passBtn').onclick = passTurn;
document.getElementById('floatPass').onclick = passTurn;

// Одно значение за ход. Запись не передаёт ход: его можно исправить и передать вручную.
function writeCell(playerIndex, school, k, v) {
  db.ref(`rooms/${code}`).transaction(room => {
    if (!room || !room.players || !room.players.length) return room;
    if (!isEditable(room, playerIndex, school, k)) return;
    if (checkValue(k, v)) return;
    const player = room.players[playerIndex];
    player.cells = player.cells || {};
    player.cells[cellKey(school, k)] = v;
    room.entered = true;
    room.enteredCell = cellKey(school, k);
    room.updatedAt = Date.now();
    return room;
  }, (err, committed) => {
    if (err || !committed) {
      toast('Сейчас ход другого игрока или ячейка пока закрыта.');
      render();
    }
  });
}

document.getElementById('sheet').addEventListener('change', e => {
  const el = e.target;
  if (!el.matches('input[data-k]')) return;
  const k = el.dataset.k;
  if (el.value === '') { render(); return; }
  const v = Number(el.value);
  const error = checkValue(k, v);
  if (error) {
    toast(error);
    render();
    return;
  }
  writeCell(Number(el.dataset.p), Number(el.dataset.s), k, v);
});

// Тема оформления запоминается на устройстве.
const themeSel = document.getElementById('themeSel');
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeSel.value = t;
  document.getElementById('credit').hidden = t !== 'grass';
}
let savedTheme = 'main';
try { savedTheme = localStorage.getItem('kosti.theme') || 'main'; } catch (e) { /* без хранилища тема не запомнится */ }
applyTheme(savedTheme);
themeSel.onchange = () => {
  applyTheme(themeSel.value);
  try { localStorage.setItem('kosti.theme', themeSel.value); } catch (e) { /* без хранилища тема не запомнится */ }
};

// Кнопки в итогах: начать заново или закрыть комнату.
function leaveRoom() {
  db.ref('rooms/' + code).off();
  code = '';
  state = null;
  mode = null;
  history.replaceState(null, '', location.pathname);
  document.getElementById('room').hidden = true;
  document.getElementById('join').hidden = false;
  document.getElementById('code').value = '';
}

document.getElementById('results').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  if (btn.dataset.act === 'restart') {
    if (!confirm('Начать игру заново? Все записанные значения будут стёрты, игроки останутся.')) return;
    db.ref(`rooms/${code}`).transaction(room => {
      if (!room || !room.players) return room;
      room.players.forEach(p => { p.cells = {}; });
      room.turn = 0;
      room.entered = false;
      room.enteredCell = null;
      room.updatedAt = Date.now();
      return room;
    });
  }
  if (btn.dataset.act === 'close') {
    if (!confirm('Закрыть комнату? Все данные комнаты будут удалены.')) return;
    db.ref(`rooms/${code}`).remove();
    saveMode(code, null);
    leaveRoom();
  }
});

showRooms();
if (location.hash.length > 1) connect(location.hash.slice(1));
</script>
</body>
</html>
